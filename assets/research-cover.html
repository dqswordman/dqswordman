<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wenzhang Du · Research profile cover</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #f7f5ec; background: #17332e; }
    main {
      position: relative;
      isolation: isolate;
      width: 1296px;
      height: 262px;
      overflow: hidden;
      padding: 47px 68px;
      background: radial-gradient(ellipse at 87% 0%, #365d4b, transparent 62%), #17332e;
    }
    main::before {
      content: '';
      position: absolute;
      z-index: -1;
      top: -245px;
      right: -207px;
      width: 778px;
      height: 778px;
      transform: rotate(-21deg) scaleX(.76);
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 34px, #b8cbb82e 35px 36px);
      mask-image: linear-gradient(to left, #000, #0002);
    }
    main::after {
      content: '';
      position: absolute;
      left: 68px;
      bottom: 36px;
      width: 44px;
      height: 2px;
      background: #d8c49a;
    }
    h1 { margin: 0 0 9px; font: 400 95px/1.04 Georgia, serif; letter-spacing: -.06em; }
    .role { margin: 0; color: #d6e4d8; font: 32px/1.4 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Wenzhang Du</h1>
    <p class="role">AI safety &amp; empirical machine learning</p>
  </main>
</body>
</html>
